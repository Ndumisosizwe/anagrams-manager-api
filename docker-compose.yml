services:
  anagrams:
    build:
      context: .
      dockerfile: Dockerfile
    image: bsg-anagrams:latest
    container_name: bsg-anagrams
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/words?size=1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
